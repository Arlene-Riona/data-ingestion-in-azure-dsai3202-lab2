$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command

display_name: amazon_review_training
experiment_name: amazon_review_training_exp

code: ../src

command: >
  python train.py
  --train_data ${{inputs.train_data}}
  --val_data ${{inputs.val_data}}
  --test_data ${{inputs.test_data}}
  --output ${{outputs.model_output}}

inputs:
  train_data:
    type: uri_folder
    path: azureml:amazon_reviews_train@latest

  val_data:
    type: uri_folder
    path: azureml:amazon_reviews_val@latest

  test_data:
    type: uri_folder
    path: azureml:amazon_reviews_test@latest

outputs:
  model_output:
    type: uri_folder
    mode: rw_mount

environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu20.04
  conda_file: ../env/conda.yml
  name: amazon-review-env

compute: azureml:lab4-cluster-60304739