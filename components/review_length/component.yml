$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: review_length_component
display_name: Review Length Feature Component
version: 12
type: command
is_deterministic: false

inputs:
  input_data:
    type: uri_folder

outputs:
  output_data:
    type: uri_folder

code: .

environment: azureml://registries/azureml/environments/sklearn-1.0/versions/41

command: >-
  python review_length.py
  --input_path ${{inputs.input_data}}
  --output_path ${{outputs.output_data}}