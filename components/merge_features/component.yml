$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json

name: merge_features
display_name: Merge All Features
version: 21
type: command
is_deterministic: false

inputs:
  length:
    type: uri_folder
  sentiment:
    type: uri_folder
  tfidf:
    type: uri_folder
  sbert:
    type: uri_folder
  raw:
    type: uri_folder

outputs:
  output:
    type: uri_folder

code: .

command: >
  python merge.py
  --length ${{inputs.length}}
  --sentiment ${{inputs.sentiment}}
  --tfidf ${{inputs.tfidf}}
  --sbert ${{inputs.sbert}}
  --raw ${{inputs.raw}}
  --output ${{outputs.output}}

environment: azureml:AzureML-sklearn-1.1-ubuntu20.04-py38-cpu@latest