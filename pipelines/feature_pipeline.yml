$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
type: pipeline

compute: azureml:lab4-cluster-60304739

settings:
  force_rerun: true

inputs:
  sampled_data:
    type: uri_folder
    path: azureml:amazon_electronics_features_v1_sampled@latest

jobs:
  split:
    type: command
    component: azureml:split_dataset@latest
    inputs:
      data: ${{parent.inputs.sampled_data}}

  # TRAINING
  normalize_train:
    type: command
    component: azureml:normalize_text@latest
    inputs:
      data: ${{parent.jobs.split.outputs.train}}

  length_train:
    type: command
    component: azureml:review_length_component@latest
    inputs:
      input_data: ${{parent.jobs.normalize_train.outputs.out}}

  sentiment_train:
    type: command
    component: azureml:sentiment_feature_component@latest
    inputs:
      input_data: ${{parent.jobs.normalize_train.outputs.out}}

  sbert_train:
    type: command
    component: azureml:sbert_embeddings@latest
    inputs:
      data: ${{parent.jobs.normalize_train.outputs.out}}
      pca_components: 64

  # VALIDATION
  normalize_val:
    type: command
    component: azureml:normalize_text@latest
    inputs:
      data: ${{parent.jobs.split.outputs.val}}

  length_val:
    type: command
    component: azureml:review_length_component@latest
    inputs:
      input_data: ${{parent.jobs.normalize_val.outputs.out}}

  sentiment_val:
    type: command
    component: azureml:sentiment_feature_component@latest
    inputs:
      input_data: ${{parent.jobs.normalize_val.outputs.out}}

  sbert_val:
    type: command
    component: azureml:sbert_embeddings@latest
    inputs:
      data: ${{parent.jobs.normalize_val.outputs.out}}
      pca_components: 64

  # TESTING
  normalize_test:
    type: command
    component: azureml:normalize_text@latest
    inputs:
      data: ${{parent.jobs.split.outputs.test}}

  length_test:
    type: command
    component: azureml:review_length_component@latest
    inputs:
      input_data: ${{parent.jobs.normalize_test.outputs.out}}

  sentiment_test:
    type: command
    component: azureml:sentiment_feature_component@latest
    inputs:
      input_data: ${{parent.jobs.normalize_test.outputs.out}}

  sbert_test:
    type: command
    component: azureml:sbert_embeddings@latest
    inputs:
      data: ${{parent.jobs.normalize_test.outputs.out}}
      pca_components: 64

  # DEPLOYMENT
  normalize_deploy:
    type: command
    component: azureml:normalize_text@latest
    inputs:
      data: ${{parent.jobs.split.outputs.deploy}}

  length_deploy:
    type: command
    component: azureml:review_length_component@latest
    inputs:
      input_data: ${{parent.jobs.normalize_deploy.outputs.out}}

  sentiment_deploy:
    type: command
    component: azureml:sentiment_feature_component@latest
    inputs:
      input_data: ${{parent.jobs.normalize_deploy.outputs.out}}

  sbert_deploy:
    type: command
    component: azureml:sbert_embeddings@latest
    inputs:
      data: ${{parent.jobs.normalize_deploy.outputs.out}}
      pca_components: 64

  # TF-IDF
  tfidf:
    type: command
    component: azureml:tfidf_features@latest
    inputs:
      train:  ${{parent.jobs.normalize_train.outputs.out}}
      val:    ${{parent.jobs.normalize_val.outputs.out}}
      test:   ${{parent.jobs.normalize_test.outputs.out}}
      deploy: ${{parent.jobs.normalize_deploy.outputs.out}}
      max_features: 100

  # MERGE (FIXED ALIGNMENT)
  merge_train:
    type: command
    component: azureml:merge_features@latest
    inputs:
      length:    ${{parent.jobs.length_train.outputs.output_data}}
      sentiment: ${{parent.jobs.sentiment_train.outputs.output_data}}
      tfidf:     ${{parent.jobs.tfidf.outputs.train_out}}
      sbert:     ${{parent.jobs.sbert_train.outputs.out}}
      raw:       ${{parent.jobs.split.outputs.train}}

  merge_val:
    type: command
    component: azureml:merge_features@latest
    inputs:
      length:    ${{parent.jobs.length_val.outputs.output_data}}
      sentiment: ${{parent.jobs.sentiment_val.outputs.output_data}}
      tfidf:     ${{parent.jobs.tfidf.outputs.val_out}}
      sbert:     ${{parent.jobs.sbert_val.outputs.out}}
      raw:       ${{parent.jobs.split.outputs.val}}

  merge_test:
    type: command
    component: azureml:merge_features@latest
    inputs:
      length:    ${{parent.jobs.length_test.outputs.output_data}}
      sentiment: ${{parent.jobs.sentiment_test.outputs.output_data}}
      tfidf:     ${{parent.jobs.tfidf.outputs.test_out}}
      sbert:     ${{parent.jobs.sbert_test.outputs.out}}
      raw:       ${{parent.jobs.split.outputs.test}}

  merge_deploy:
    type: command
    component: azureml:merge_features@latest
    inputs:
      length:    ${{parent.jobs.length_deploy.outputs.output_data}}
      sentiment: ${{parent.jobs.sentiment_deploy.outputs.output_data}}
      tfidf:     ${{parent.jobs.tfidf.outputs.deploy_out}}
      sbert:     ${{parent.jobs.sbert_deploy.outputs.out}}
      raw:       ${{parent.jobs.split.outputs.deploy}}